name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (no GPU libraries, no PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^(nvidia-|pyinstaller)' } |
            Set-Content requirements-ci.txt
          python -m pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
