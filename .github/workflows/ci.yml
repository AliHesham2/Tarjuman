name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (no GPU libraries, no PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^(nvidia-|pyinstaller)' } |
            Set-Content requirements-ci.txt
          python -m pip install -r requirements-ci.txt
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content test-output.txt | Select-String -Pattern 'ERROR|FAIL|Traceback|Error' | Select-Object -First 15 | ForEach-Object { $_.Line }) -join ' || '
            Write-Output "::error title=Test failures::$tail"
          }
          exit $code
